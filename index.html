<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>한글 — Korean Alphabet & Stage 1</title>
<style>
  :root { --pink:#FCE4EE; --white:#fff; --black:#111; --muted:#5b5b5b; --cyan:#9BE9FB; --lilac:#FAE8FF; --ice:#DDF3FB; --yellow:#FDE68A; --green:#D9F99D; --rose:#F6BED5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background:var(--pink); color:var(--black); }
  header { padding:20px 16px 8px; max-width:640px; margin:0 auto; }
  .kicker { font-size:11px; font-weight:900; letter-spacing:1.1px; color:var(--muted); }
  h1 { font-size:28px; margin:4px 0 12px; font-weight:900; }
  nav { display:flex; gap:8px; }
  nav button { flex:1; padding:10px; border:2px solid var(--black); border-radius:14px; background:var(--white); font-weight:900; cursor:pointer; font-size:13px; font-family:inherit; }
  nav button.on { background:var(--black); color:var(--white); }
  main { max-width:640px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--white); border:2px solid var(--black); border-radius:22px; padding:18px; box-shadow:5px 5px 0 var(--black); }
  .eyebrow { font-size:10px; font-weight:900; letter-spacing:1px; color:var(--muted); }
  .big { font-size:40px; font-weight:900; line-height:1.1; }
  .glyph { font-size:120px; font-weight:900; line-height:1.05; text-align:center; margin-top:8px; }
  .glyph.small { font-size:64px; line-height:1; text-align:left; margin-top:0; }
  .sub { font-size:14px; color:var(--muted); font-weight:700; margin-top:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:2px solid var(--black); border-radius:14px; background:var(--cyan); padding:10px 14px; font-weight:900; cursor:pointer; font-size:14px; font-family:inherit; color:var(--black); }
  .btn.alt { background:var(--white); }
  .btn.ink { background:var(--black); color:var(--white); }
  .btn.rose { background:var(--rose); }
  .btn.yel { background:var(--yellow); }
  .btn.grn { background:var(--green); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip { flex:0 0 auto; border:2px solid var(--black); border-radius:14px; background:var(--white); padding:8px 12px; font-weight:900; font-size:12px; cursor:pointer; font-family:inherit; }
  .chip.on { background:var(--black); color:var(--white); }
  .bar { height:12px; border:2px solid var(--black); border-radius:8px; background:var(--white); overflow:hidden; }
  .bar.thin { height:8px; }
  .bar > div { height:100%; background:var(--cyan); }
  .letters { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; }
  .tile { border:2px solid var(--black); border-radius:14px; padding:10px 4px; text-align:center; background:var(--white); cursor:pointer; font-weight:900; font-size:14px; font-family:inherit; color:var(--black); }
  .tile.done { background:var(--green); }
  .tile.locked { opacity:.45; }
  .tile .tg { display:block; font-size:28px; line-height:1.2; }
  .tile small { display:block; font-size:10px; color:var(--muted); font-weight:800; }
  .pron { font-size:17px; font-weight:800; color:var(--muted); margin-top:4px; }
  .say { background:var(--lilac); border:2px solid var(--black); border-radius:14px; padding:10px; font-size:13px; font-weight:800; }
  .sec { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.8px; }
  .line { display:flex; gap:10px; padding:6px 0; border-bottom:1px dashed #ccc; }
  .line:last-child { border-bottom:0; }
  .speaker { width:18px; font-weight:900; color:var(--muted); }
  ul.check { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  ul.check li { font-size:14px; font-weight:700; color:var(--muted); }
  ul.check li::before { content:"☐ "; color:var(--black); font-weight:900; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .choice { border:2px solid var(--black); border-radius:14px; background:var(--white); padding:12px 6px; font-weight:900; cursor:pointer; font-size:13px; font-family:inherit; color:var(--black); }
  .choice .cg { display:block; font-size:40px; line-height:1.1; }
  .choice small { color:var(--muted); font-weight:800; font-size:10px; }
  .choice.right { background:var(--green); }
  .choice.wrong { background:var(--rose); }
  .choice:disabled { cursor:default; }
  footer { text-align:center; font-size:11px; color:var(--muted); padding:24px; }
  button:focus-visible { outline:3px solid var(--black); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <div class="kicker">HANGEUL</div>
  <h1>Learn Korean, step by step</h1>
  <nav>
    <button data-tab="letters" class="on">Alphabet</button>
    <button data-tab="stage">Stage 1</button>
    <button data-tab="reading">Reading</button>
  </nav>
</header>
<main id="app"></main>
<footer>Progress is saved in this browser only.</footer>

// ---------- Data prep ----------
const LETTERS = DATA.letters.map(r => ({ id:r[0], glyph:r[1], hangulName:r[2], rrName:r[3], sound:r[4], guide:r[5], example:r[6], rr:r[7], meaning:r[8], tip:r[9], deck:r[10] }));
const LETTER_BY_ID = Object.fromEntries(LETTERS.map(l => [l.id, l]));
const STAGE_ITEMS = DATA.stage.rows.map((r, i) => ({
  id: "stage-1-" + (i + 1), number: i + 1, ko: r[0], pron: r[1], en: r[2],
  group: r[3], day: Math.floor(i / 20) + 1, section: DATA.stage.groups[r[3] - 1]
}));

// ---------- Persistence & learning state (ports the Expo store logic) ----------
const KEY = "hangeul-web-v1";
const DAY_MS = 24 * 60 * 60 * 1000;
const pad = (n) => String(n).padStart(2, "0");
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const blankCard = () => ({ correct:0, incorrect:0, repetitions:0, mastery:0, nextReview:0, lastReviewed:null });
function safeParse(raw) { try { return JSON.parse(raw) || {}; } catch (e) { return {}; } }
function normalize(v) {
  const cards = {};
  LETTERS.forEach(l => { cards[l.id] = { ...blankCard(), ...((v.cards || {})[l.id] || {}) }; });
  return { cards, dailyGoal: v.dailyGoal ?? 10, dailyCompleted: v.dailyCompleted ?? 0, streak: v.streak ?? 0,
           lastPracticeDate: v.lastPracticeDate ?? null, reviewed: v.reviewed || {}, flip: v.flip || {} };
}
let state = normalize(safeParse(localStorage.getItem(KEY)));
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const isMastered = (id) => state.cards[id].mastery >= 3;
const masteredCount = () => LETTERS.filter(l => isMastered(l.id)).length;
const unlockedCount = () => Math.min(6 + Math.floor(masteredCount() / 2) * 4, DATA.learnOrder.length);
function unlockedLetters() {
  const open = new Set(DATA.learnOrder.slice(0, unlockedCount()));
  return LETTERS.filter(l => open.has(l.id));
}
function dueLetters(limit = 6) {
  const now = Date.now();
  return unlockedLetters()
    .filter(l => state.cards[l.id].nextReview <= now)
    .sort((a, b) => {
      const A = state.cards[a.id], B = state.cards[b.id];
      return A.mastery !== B.mastery ? A.mastery - B.mastery : A.nextReview - B.nextReview;
    })
    .slice(0, limit);
}
function pickSession(limit = 6) {
  const due = dueLetters(limit);
  if (due.length >= limit) return due;
  const dueIds = new Set(due.map(l => l.id));
  return [...due, ...unlockedLetters().filter(l => !dueIds.has(l.id))].slice(0, limit);
}
function nextReviewFor(rating, reps) {
  const now = Date.now();
  if (rating === "again") return now;
  if (rating === "hard") return now + (reps <= 1 ? 0.25 : reps <= 3 ? 0.75 : 2) * DAY_MS;
  return now + (reps <= 1 ? 0.5 : reps === 2 ? 1 : reps === 3 ? 3 : reps < 6 ? 7 : 21) * DAY_MS;
}
function applyReview(id, rating) {
  const cur = state.cards[id];
  const ok = rating !== "again";
  const reps = ok ? cur.repetitions + 1 : 0;
  const mastery = Math.max(0, Math.min(5, cur.mastery + (rating === "got-it" ? 2 : rating === "hard" ? 1 : -1)));
  const today = dateKey();
  const last = state.lastPracticeDate;
  const y = new Date(); y.setDate(y.getDate() - 1);
  state.dailyCompleted = last === today ? state.dailyCompleted + 1 : 1;
  state.streak = last === today ? state.streak : last === dateKey(y) ? Math.max(1, state.streak + 1) : 1;
  state.lastPracticeDate = today;
  state.cards[id] = { correct: cur.correct + (ok ? 1 : 0), incorrect: cur.incorrect + (ok ? 0 : 1), repetitions: reps,
                      mastery, nextReview: nextReviewFor(rating, reps), lastReviewed: Date.now() };
  save();
}

// ---------- Audio ----------
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR";
  u.rate = 0.8;
  window.speechSynthesis.speak(u);
}
function hearBtn(text, label) {
  return `<button class="btn alt" data-speak="${esc(text)}" aria-label="${esc(label)}">🔊 Hear it</button>`;
}

// ---------- UI state ----------
const app = document.getElementById("app");
let tab = "letters", deck = "familiar", letterId = null;
let stageDay = 1, stageIndex = 0, stageRevealed = false, showPatterns = false, showConv = false;
let session = null;

function shuffle(a) { return a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]); }
function makeChoices(id) {
  const others = shuffle(unlockedLetters().filter(l => l.id !== id)).slice(0, 3);
  return shuffle([LETTER_BY_ID[id], ...others]);
}
function startSession(mode) {
  const ids = pickSession(6).map(l => l.id);
  session = { mode, ids, i: 0, flipped: false, picked: null, done: false, choices: makeChoices(ids[0]) };
}
function advanceSession() {
  session.i++; session.flipped = false; session.picked = null;
  if (session.i >= session.ids.length) session.done = true;
  else session.choices = makeChoices(session.ids[session.i]);
}

  else handleMain(d);
  save(); render();
});
function handleSession(d) {
  const s = session;
  if (d.sClose) { session = null; return; }
  if (s.done) { if (d.sAgain) startSession(s.mode); return; }
  const L = LETTER_BY_ID[s.ids[s.i]];
  if (d.sFlip) s.flipped = true;
  else if (d.rate) { applyReview(L.id, d.rate); advanceSession(); }
  else if (d.pick) { if (s.picked === null) { s.picked = d.pick; applyReview(L.id, d.pick === L.id ? "got-it" : "again"); } }
  else if (d.sNext) advanceSession();
  else if (d.sAgain) startSession(s.mode);
}
function handleMain(d) {
  if (d.start) startSession(d.start);
  else if (d.goal) state.dailyGoal = Math.max(5, Math.min(30, state.dailyGoal + Number(d.goal)));
  else if (d.deck) { deck = d.deck; letterId = null; }
  else if (d.letter) letterId = d.letter;
  else if (d.close) letterId = null;
  else if (d.flip) state.flip[d.flip] = !state.flip[d.flip];
  else if (d.know) { const c = state.cards[d.know]; c.mastery = c.mastery >= 3 ? 0 : 3; }
  else if (d.day) { stageDay = Number(d.day); stageIndex = 0; stageRevealed = false; }
  else if (d.reveal) stageRevealed = true;
  else if (d.next) { const items = stageDayItems(); const it = items[stageIndex % items.length]; state.reviewed[it.id] = true; stageIndex++; stageRevealed = false; }
  else if (d.again) { stageIndex++; stageRevealed = false; }
  else if (d.toggle === "patterns") showPatterns = !showPatterns;
  else if (d.toggle === "conv") showConv = !showConv;
}
render();
</script>
